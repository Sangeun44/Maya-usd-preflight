name: ci

on:
  push:
  pull_request:

jobs:
  # The checks and the export verification, which need no Maya.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: pip install -e ".[dev]" PySide6
      - run: pytest -q -rs
        env:
          QT_QPA_PLATFORM: offscreen

  # The Maya half, inside real Maya.
  maya:
    strategy:
      fail-fast: false
      matrix:
        maya: ["2024", "2025"]
    runs-on: ubuntu-latest
    container: tahv/mayapy:${{ matrix.maya }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: mayapy -m pip install pytest
      - name: Install the Maya USD plug-in
        # The container has Maya but not Maya USD, so add Autodesk's release build.
        continue-on-error: true
        run: |
          case "${{ matrix.maya }}" in
            2024) build=2024.2 ;;
            2025) build=2025.3 ;;
          esac
          url="https://github.com/Autodesk/maya-usd/releases/download/v${MAYAUSD}/MayaUSD_${MAYAUSD}_Maya${build}_Linux.run"
          code=0
          sh .github/install_mayausd.sh "$url" > install.log 2>&1 || code=$?
          cat install.log
          printf '::notice title=Maya USD install (exit %s)::' "$code"; tail -c 6000 install.log | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'
          exit "$code"
        env:
          MAYAUSD: "0.37.0"
      - run: mayapy -m pytest tests/maya -v -rs
      - name: Maya and Maya USD versions
        if: always()
        run: |
          mayapy -c "import maya.standalone; maya.standalone.initialize(); from maya import cmds; import sys, os
          print('::notice title=Maya::' + cmds.about(version=True) + ' / Python ' + sys.version.split()[0])
          try:
              cmds.loadPlugin('mayaUsdPlugin', quiet=True); print('::notice title=Maya USD::' + str(cmds.pluginInfo('mayaUsdPlugin', query=True, version=True)))
          except RuntimeError as e:
              print('::notice title=Maya USD::not available: ' + str(e).strip().splitlines()[-1])
          sys.stdout.flush(); os._exit(0)"
      - name: Build the example scenes and batch-check them
        if: always()
        run: |
          mayapy examples/make_scenes.py examples/scenes
          code=0
          mayapy preflight_batch.py examples/scenes --out out --snapshots > batch.log 2>&1 || code=$?
          cat batch.log
          printf '::notice title=batch (exit %s)::' "$code"; tail -c 6000 batch.log | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'
          echo "exit code $code"
          # One of the two scenes is broken on purpose, so exactly one must fail.
          test "$code" -eq 1
      - name: Batch export (needs the Maya USD plug-in)
        run: |
          code=0
          mayapy preflight_batch.py examples/scenes --out out --export > export.log 2>&1 || code=$?
          cat export.log
          printf '::notice title=batch export (exit %s)::' "$code"; tail -c 6000 export.log | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'
          echo "exit code $code"
          if [ "$code" -eq 2 ]; then
            echo "::warning::Maya USD plug-in is not in this image, so the export was not tested"
          else
            test "$code" -eq 1
            test -f out/clean_crate.usda
            test ! -f out/broken_crate.usda
          fi
      - name: Re-check a saved snapshot without starting Maya
        run: |
          code=0
          PYTHONPATH=scripts mayapy -m usd_preflight out/broken_crate.snapshot.json --profile profiles/sim_ready.json || code=$?
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-${{ matrix.maya }}
          path: out/
